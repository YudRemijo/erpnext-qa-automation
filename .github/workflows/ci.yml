name: Offline CI (not ERPNext E2E)

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline checks / ${{ matrix.os }} / Python 3.12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      CI: "true"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/qa-no-browser-runtime
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints-dev.txt
      - name: Install pinned direct dependencies (no browser install)
        run: python -m pip install -r requirements-dev.txt -c constraints-dev.txt
      - name: Check dependency integrity
        run: python -m pip check
      - name: Check syntax, configuration and publication safety
        run: python scripts/check_project.py
      - name: Parse workflow YAML without installing extra tooling
        run: python scripts/validate_workflow.py
      - name: Run offline tests only
        run: python -m pytest -m offline -v --junitxml=reports/offline.xml
